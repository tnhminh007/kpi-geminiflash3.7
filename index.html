    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Safe guard window.fetch to provide a setter if defined as getter-only in sandboxed iframes
      try {
        if (typeof window !== 'undefined' && typeof window.fetch === 'function') {
          let _fetch = window.fetch.bind(window);
          Object.defineProperty(window, 'fetch', {
            get() {
              return _fetch;
            },
            set(val) {
              _fetch = val;
            },
            configurable: true,
            enumerable: true,
          });
        }
      } catch (e) {
        // Silently continue if environment prevents redefinition
      }
    </script>
